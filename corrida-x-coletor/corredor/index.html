<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b132b" />
<meta name="description" content="Ritmex: o calendário de corridas de rua da sua cidade, com a sua turma." />
<title>Ritmex — corridas de rua perto de você</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="icone-192.png" />
<style>
/* Ritmex — app do corredor. Tema escuro azul-noite (#0B132B) com laranja energia (#FF5E00),
   fonte do sistema. Pensado para celular primeiro (barra de abas embaixo), funciona de 320px para cima. */
:root {
  --bg: #0b132b; --surface: #121c3b; --surface-2: #1a2650; --border: #27355f; --text: #eef1f8; --muted: #9aa5c4;
  --accent: #ff5e00; --accent-dark: #e05200; --accent-bg: rgba(255, 94, 0, .14); --on-accent: #ffffff;
  --danger: #ff8a80; --danger-bg: rgba(255, 82, 82, .14); --warn-bg: rgba(255, 179, 0, .14); --warn: #ffcc66;
  --ok-bg: rgba(76, 217, 100, .14); --ok: #7ee2a0; --gold-bg: rgba(255, 196, 0, .14); --gold: #ffd166; --gold-border: #8a6a1f;
  --radius: 14px; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tab-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.45; }
button, input, select, textarea { font: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topo { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 16px;
        background: rgba(11, 19, 43, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.topo .marca { width: 34px; height: 34px; border-radius: 9px; flex: none; }
.topo h1 { margin: 0; font-size: 18px; flex: 1; letter-spacing: .5px; font-weight: 800; min-width: 0; }
.topo h1 small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: 0; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-bg); color: var(--accent);
          display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
          flex: none; border: 0; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
button.avatar { cursor: pointer; }
.avatar--p { width: 26px; height: 26px; font-size: 11px; }

.conteudo { max-width: 760px; margin: 0 auto; padding: 14px 16px calc(var(--tab-h) + 28px); }
.carregando { text-align: center; color: var(--muted); padding: 60px 0; }

.abas { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; background: rgba(11, 19, 43, .97);
        border-top: 1px solid var(--border); height: calc(var(--tab-h) + env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom); }
.abas button { flex: 1; border: 0; background: none; color: var(--muted); font-size: 11px; display: flex;
               flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; min-width: 0; }
.abas button svg { width: 22px; height: 22px; }
.abas button[aria-current="page"] { color: var(--accent); font-weight: 700; }

.painel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.painel h2 { margin: 0 0 10px; font-size: 17px; }
.painel h3 { margin: 16px 0 8px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.dica { color: var(--muted); font-size: 13px; margin: 6px 0; }
.erro { background: var(--danger-bg); color: var(--danger); padding: 10px 12px; border-radius: 10px; font-size: 14px; margin: 8px 0; }
.aviso { background: var(--warn-bg); color: var(--warn); padding: 10px 12px; border-radius: 10px; font-size: 13px; margin: 0 0 14px; }
.ok { background: var(--ok-bg); color: var(--ok); padding: 10px 12px; border-radius: 10px; font-size: 14px; margin: 8px 0; }

.campo { margin-bottom: 12px; }
.campo label, .rotulo { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], input[type="search"], input[type="url"], select, textarea {
  width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px;
  background: var(--surface-2); color: var(--text); }
input::placeholder, textarea::placeholder { color: #6f7ba0; }
textarea { resize: vertical; min-height: 64px; }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 10px; }
.grade--2 { grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .grade { grid-template-columns: 1fr 1fr; } }
.linha { display: flex; gap: 8px; align-items: center; }
.linha > input, .linha > select { flex: 1; min-width: 0; }
.opcao { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 6px 0; cursor: pointer; }
.opcao input { width: 18px; height: 18px; accent-color: var(--accent); }

.btn { padding: 10px 16px; border: 1px solid var(--accent); border-radius: 10px; background: var(--accent); color: var(--on-accent);
       font-size: 15px; font-weight: 700; cursor: pointer; min-height: 42px; }
.btn:hover { background: var(--accent-dark); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn--sec { background: transparent; color: var(--text); border-color: var(--border); font-weight: 600; }
.btn--sec:hover { background: var(--surface-2); }
.btn--sm { padding: 6px 12px; font-size: 13px; min-height: 34px; }
.btn--perigo { background: transparent; color: var(--danger); border-color: #6b2b35; }
.btn--cheio { width: 100%; }
.btn--google { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: #fff; color: #1f1f1f; border-color: #fff; }
.btn--google:hover { background: #e9edf5; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 999px;
                padding: 6px 13px; font-size: 13px; cursor: pointer; min-height: 34px; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.filtros { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.rolagem { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; scrollbar-width: none; }
.rolagem::-webkit-scrollbar { display: none; }
.rolagem button { flex: none; }

.selo { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.selo--tema { background: rgba(186, 104, 255, .16); color: #d6a8ff; }
.selo--noite { background: rgba(110, 140, 255, .16); color: #aebdff; }
.selo--gold { background: var(--gold-bg); color: var(--gold); }
.selo--ok { background: var(--ok-bg); color: var(--ok); }
.selo--warn { background: var(--warn-bg); color: var(--warn); }
.selo--preco { background: var(--accent-bg); color: #ffb27f; }

.dia { margin: 20px 0 8px; font-size: 12px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .6px; }
.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.cartao { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.cartao--gold { border-color: var(--gold-border); }
.cartao-cab { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.cartao-nome { font-weight: 750; font-size: 15px; overflow-wrap: anywhere; }
.meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
.etiquetas { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.cartao-rodape { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.cartao-rodape .espaco { flex: 1; }
.links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; margin-top: 8px; }
.links a { font-weight: 600; display: inline-block; padding: 4px 0; }
.btn-vou { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 999px;
           padding: 7px 14px; font-weight: 700; font-size: 14px; cursor: pointer; min-height: 38px; }
.btn-vou[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.quem { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
.pilha { display: flex; }
.pilha .avatar { margin-left: -6px; border: 2px solid var(--surface); }
.pilha .avatar:first-child { margin-left: 0; }

/* Provas: região em destaque e a próxima prova no topo */
.regiao-atual { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.regiao-atual .pino { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-bg); color: var(--accent);
                      display: inline-flex; align-items: center; justify-content: center; flex: none; }
.regiao-atual b { display: block; font-size: 16px; }
.regiao-atual .espaco { flex: 1; min-width: 0; }
.destaque { position: relative; overflow: hidden; border-radius: 18px; padding: 16px; margin: 10px 0 6px;
            background: linear-gradient(135deg, #1b2a5a 0%, #121c3b 60%); border: 1px solid #34467d; }
.destaque::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%;
                   background: radial-gradient(circle, rgba(255, 94, 0, .35), transparent 70%); pointer-events: none; }
.destaque .rotulo-destaque { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .8px; }
.destaque .nome { font-size: 19px; font-weight: 800; margin: 4px 0 2px; overflow-wrap: anywhere; }
.contagem-grande { display: flex; gap: 8px; margin: 12px 0; }
.contagem-grande div { background: rgba(255, 255, 255, .06); border-radius: 10px; padding: 8px 10px; text-align: center; min-width: 58px; }
.contagem-grande b { display: block; font-size: 22px; font-weight: 800; line-height: 1.1; }
.contagem-grande span { font-size: 11px; color: var(--muted); }
.btn-inscricao { display: block; text-align: center; text-decoration: none; margin-top: 10px; }

.numeros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
@media (max-width: 520px) { .numeros { grid-template-columns: 1fr 1fr; } }
.numero { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.numero b { display: block; font-size: 22px; font-weight: 800; }
.numero span { font-size: 12px; color: var(--muted); }

.pessoa { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.pessoa:last-child { border-bottom: 0; }
.pessoa .info { flex: 1; min-width: 0; }
.pessoa .info b { display: block; font-size: 14px; overflow-wrap: anywhere; }
.pessoa .info span { font-size: 12px; color: var(--muted); }

/* Feed: cartões de post */
.post { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.post-cab { display: flex; gap: 10px; align-items: center; }
.post-cab .info { flex: 1; min-width: 0; }
.post-cab b { display: block; font-size: 14px; }
.post-cab span { font-size: 12px; color: var(--muted); }
.post-texto { margin: 10px 0 0; font-size: 15px; overflow-wrap: anywhere; }
.post-faixa { margin-top: 10px; border-radius: 12px; padding: 12px; background: linear-gradient(135deg, #ff5e00, #ff8a3d); color: #fff; }
.post-faixa b { display: block; font-size: 16px; }
.post-faixa span { font-size: 13px; opacity: .95; }
.post-prova { margin-top: 10px; border-radius: 12px; padding: 12px; background: var(--surface-2); }
.post-prova b { display: block; }
.post-prova span { font-size: 13px; color: var(--muted); }

/* Perfil: medalhas */
.medalhas { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.medalha { text-align: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 6px; }
.medalha .icone { font-size: 30px; line-height: 1; }
.medalha b { display: block; font-size: 12px; margin-top: 6px; }
.medalha span { font-size: 11px; color: var(--muted); }
.medalha--bloqueada { opacity: .38; filter: grayscale(1); }

table.ranking { width: 100%; border-collapse: collapse; font-size: 14px; }
.ranking th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--border); }
.ranking td { padding: 8px 4px; border-bottom: 1px solid var(--border); }
.ranking td.num, .ranking th.num { text-align: right; white-space: nowrap; }
.ranking tr.eu td { font-weight: 800; color: var(--accent); }
.codigo { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; letter-spacing: 2px; background: var(--surface-2); padding: 2px 8px; border-radius: 6px; }

.vazio { color: var(--muted); font-size: 14px; text-align: center; padding: 22px 8px; }
.login { max-width: 420px; margin: 30px auto; text-align: center; }
.login .logo { width: 88px; height: 88px; margin: 0 auto 10px; border-radius: 22px; display: block; }
.login h2 { font-size: 26px; margin: 0; letter-spacing: 1px; font-weight: 900; }
.login .slogan { color: var(--accent); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .8px; margin: 2px 0 10px; }
.login ul { text-align: left; font-size: 14px; color: var(--muted); padding-left: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 16px); transform: translateX(-50%); background: #f2f4fa; color: #0b132b;
         padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.voltar { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 6px 0; font-size: 14px; }
details.mais summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 600; }

/* Strava: botão na cor da marca (diretrizes do Strava) e gráficos simples */
.btn-strava { background: #fc5200; color: #fff; border: 0; border-radius: 10px; padding: 11px 18px; font-size: 15px; font-weight: 700;
              cursor: pointer; min-height: 44px; }
.btn-strava:hover { background: #e34a00; }
.powered-strava { text-align: right; margin-top: 12px; }
.powered-strava b { color: #fc5200; }
.barras { display: flex; align-items: flex-end; gap: 6px; height: 130px; padding-top: 4px; }
.barra { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
.barra-col { width: 100%; max-width: 36px; background: #34467d; border-radius: 5px 5px 0 0; }
.barra:last-child .barra-col { background: var(--accent); }
.barra-valor { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.barra-rotulo { font-size: 11px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<header class="topo" id="topo" hidden>
  <img class="marca" src="icone-192.png" alt="" width="34" height="34" />
  <h1>RITMEX <small id="topo-sub"></small></h1>
  <button type="button" class="avatar" id="btn-perfil" aria-label="Meu perfil"></button>
</header>

<main class="conteudo" id="conteudo">
  <p class="carregando" id="carregando">Carregando...</p>
</main>

<nav class="abas" id="abas" hidden aria-label="Seções">
  <button type="button" data-aba="provas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Provas</button>
  <button type="button" data-aba="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.4.2 4 1.8 4.5 4.5"/></svg>Feed</button>
  <button type="button" data-aba="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Meu Painel</button>
  <button type="button" data-aba="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.2-6 8-6s7 2 8 6"/></svg>Perfil</button>
</nav>

<script type="module">
// ============================================================================
//  Ritmex — app do corredor (protótipo do piloto)
//
//  Um arquivo só (HTML + CSS + JS), como o B31. Dados no Firebase (Auth com Google + Firestore).
//  Sem configuração do Firebase, o app abre em MODO DEMONSTRAÇÃO: dados de exemplo guardados
//  só neste navegador, sem login real. As provas da demonstração vêm do coletor (amostra do
//  projeto piloto) e os links são fictícios (domínios .example).
//
//  Regras de segurança da página:
//   1. Nada que o usuário digita ou que vem do banco entra como HTML: tudo via textContent (el()).
//   2. Só links http(s) viram <a>; WhatsApp vira https://wa.me/<só dígitos>.
//   3. As permissões de verdade ficam no firestore.rules (a página pode ser alterada por qualquer um).
// ============================================================================

// ------------------------- CONFIGURAÇÃO -------------------------
// Cole aqui a configuração do app Web do Firebase (Configurações do projeto > Seus apps).
// Esses dados não são segredo (vão para o navegador de todo mundo); a proteção está no firestore.rules.
// Deixe null para o modo demonstração. Com a configuração, "?demo" no endereço também abre a demonstração.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDinkth3a0tHE9sJSJEBra8DsvTc-uuiTE",
  authDomain: "corrida-x.firebaseapp.com",
  projectId: "corrida-x",
  appId: "1:833045052255:web:f8e046a99aacf6749414ea",
};
const CONTATO_PARCEIROS = "mailto:projetos.tecnologia2026@gmail.com?subject=Quero%20ser%20parceiro%20do%20Ritmex";
const CIDADE = "São Paulo"; // cidade padrão (a do coletor) e, por enquanto, a única dividida em zonas
// Sugestões do campo Cidade; a pessoa pode digitar outra. As cidades das provas publicadas entram também.
const CIDADES_SUGERIDAS = ["São Paulo", "Campinas", "Santos", "São José dos Campos", "Sorocaba", "Ribeirão Preto",
  "Jundiaí", "Rio de Janeiro", "Belo Horizonte", "Curitiba", "Porto Alegre", "Brasília"];
const FIREBASE_VERSAO = "10.13.0";

// Conexão com o Strava (opcional). Os dados do Strava são lidos na hora, direto do Strava, e mostrados
// SÓ para o atleta que conectou (regra do acordo de API do Strava); nada vai para o feed nem para o ranking.
// STRAVA_API é o servidor da pasta strava-api/ (Vercel), que guarda o Client Secret. Vazio = conexão desligada.
const STRAVA_CLIENT_ID = "288160";
const STRAVA_API = "";
const STRAVA_ESCOPOS = "read,activity:read_all,profile:read_all";

const REGIOES = ["zona sul", "zona norte", "zona leste", "zona oeste", "centro"];
const NOME_REGIAO = { "zona sul": "Zona sul", "zona norte": "Zona norte", "zona leste": "Zona leste", "zona oeste": "Zona oeste", centro: "Centro" };
const DISTANCIAS = [
  { chave: "ate5", nome: "Até 5 km", min: 0, max: 5.99 },
  { chave: "10", nome: "6 a 12 km", min: 6, max: 12.99 },
  { chave: "meia", nome: "15 a 21 km", min: 13, max: 21.5 },
  { chave: "maratona", nome: "Maratona", min: 40, max: 50 },
];
const CATEGORIAS = { nutricao: "Nutrição", fisioterapia: "Fisioterapia", assessoria: "Assessoria de corrida", consultoria: "Consultoria / treinador", outros: "Outros" };
const LIMITE_IN = 30; // o Firestore aceita até 30 valores num filtro "in"

// ------------------------- UTILITÁRIOS -------------------------
const $ = (s, r = document) => r.querySelector(s);

function el(tag, atributos = {}, ...filhos) {
  const no = tag === "svg" ? document.createElementNS("http://www.w3.org/2000/svg", "svg") : document.createElement(tag);
  for (const [k, v] of Object.entries(atributos)) {
    if (v === false || v == null) continue;
    if (k === "class") no.setAttribute("class", v);
    else if (k.startsWith("on") && typeof v === "function") no.addEventListener(k.slice(2), v);
    else no.setAttribute(k, v === true ? "" : v);
  }
  for (const f of filhos.flat(Infinity)) if (f != null && f !== false) no.append(f);
  return no;
}

function normalizar(t) {
  return String(t || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}
const slug = (t) => normalizar(t).replace(/ /g, "-").slice(0, 60) || "item";
const mesmaCidade = (a, b) => normalizar(a) === normalizar(b);
const temZonas = (cidade) => mesmaCidade(cidade, CIDADE);
const cidadeDa = (x) => x?.cidade || CIDADE; // provas e perfis de antes do campo cidade são de São Paulo
// Mesma grafia para todos ("sao paulo", "SP" -> "São Paulo"), senão o filtro por cidade separa iguais.
function cidadeCanonica(texto) {
  const t = String(texto || "").trim().replace(/\s+/g, " ");
  if (normalizar(t) === "sp") return CIDADE;

}

function quandoRelativo(isoDataHora) {
  const seg = (Date.now() - new Date(isoDataHora).getTime()) / 1000;
  if (!isFinite(seg)) return "";
  if (seg < 60) return "agora";
  if (seg < 3600) return `há ${Math.floor(seg / 60)} min`;
  if (seg < 86400) return `há ${Math.floor(seg / 3600)} h`;
  const d = Math.floor(seg / 86400);
  return d === 1 ? "ontem" : `há ${d} dias`;
}

// Distâncias da prova em km ("5 km", "10K", "21 km", "meia maratona") -> [5, 10, 21.1]
function distanciasEmKm(lista) {
  const saida = [];
  for (const d of lista || []) {
    const t = normalizar(d);
    if (/meia maratona|half/.test(t)) saida.push(21.1);
    else if (/maratona|marathon/.test(t)) saida.push(42.2);
    const m = String(d).replace(",", ".").match(/(\d+(?:\.\d+)?)\s*k/i);
    if (m) saida.push(Number(m[1]));
  }
  return saida;
}

// ------------------------- GPX -------------------------
function lerGpx(texto) {
  const xml = new DOMParser().parseFromString(texto, "application/xml");
  if (xml.querySelector("parsererror")) throw new Error("Arquivo GPX inválido.");
  const pontos = [...xml.querySelectorAll("trkpt, rtept")].map((p) => ({
    lat: Number(p.getAttribute("lat")),
    lon: Number(p.getAttribute("lon")),
    t: p.querySelector("time")?.textContent || null,
  })).filter((p) => isFinite(p.lat) && isFinite(p.lon));
  if (pontos.length < 2) throw new Error("O GPX não tem um percurso (pontos de trajeto).");
  const R = 6371;
  const rad = (g) => (g * Math.PI) / 180;
  let total = 0;
  for (let i = 1; i < pontos.length; i++) {
    const a = pontos[i - 1], b = pontos[i];
    const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
    total += 2 * R * Math.asin(Math.sqrt(h));
  }
  const ini = pontos.find((p) => p.t)?.t, fim = [...pontos].reverse().find((p) => p.t)?.t;
  const minutos = ini && fim ? Math.round((new Date(fim) - new Date(ini)) / 60000) : null;
  const nome = xml.querySelector("trk > name, metadata > name")?.textContent?.trim() || "";
  const data = ini ? ini.slice(0, 10) : null;
  return { km: Math.round(total * 100) / 100, minutos: minutos > 0 ? minutos : null, data, nome };
}

function validarPerfil(p) {
  const nome = String(p.nome || "").trim().replace(/\s+/g, " ");
  if (nome.length < 2 || nome.length > 60) throw new Error("O nome deve ter de 2 a 60 caracteres.");
  const handle = String(p.handle || "").trim().replace(/^@/, "").toLowerCase();
  if (!/^[a-z0-9_.]{3,20}$/.test(handle)) throw new Error("O @usuário deve ter de 3 a 20 letras, números, ponto ou _.");
  const cidade = cidadeCanonica(p.cidade);
  if (cidade.length < 2 || cidade.length > 60) throw new Error("Informe a sua cidade.");
  const zonas = temZonas(cidade);
  if (zonas && !REGIOES.includes(p.regiao)) throw new Error("Escolha a zona onde você corre.");
  const instagram = String(p.instagram || "").trim().replace(/^@/, "");
  if (instagram && !/^[A-Za-z0-9._]{1,30}$/.test(instagram)) throw new Error("Instagram inválido.");
  const distancias = (p.distancias || []).filter((d) => DISTANCIAS.some((x) => x.chave === d));
  // Zonas favoritas de treino (só em São Paulo): além da zona principal, onde a pessoa gosta de correr.
  const favoritas = zonas ? [...new Set((p.zonas || []).filter((z) => REGIOES.includes(z)))].slice(0, 5) : [];
  return { nome, handle, cidade, regiao: zonas ? p.regiao : "", zonas: favoritas, instagram, distancias, nomeBusca: normalizar(nome), foto: p.foto || null };
}

// "Concluí esta prova": distância corrida (km) e tempo opcional ("52:10" ou "1:05:30").
function lerTempo(texto) {
  const t = String(texto || "").trim();
  if (!t) return null;
  const partes = t.split(":").map((x) => Number(x));
  if (partes.some((x) => !Number.isInteger(x) || x < 0) || partes.length < 2 || partes.length > 3) throw new Error("Tempo no formato mm:ss ou h:mm:ss (ex.: 52:10).");
  const [h, m, s] = partes.length === 3 ? partes : [0, ...partes];
  if (m > 59 || s > 59) throw new Error("Tempo inválido (minutos e segundos até 59).");
  const total = h * 3600 + m * 60 + s;
  if (!(total > 60 && total < 24 * 3600)) throw new Error("Tempo inválido.");
  return total;
}
function validarConclusao(prova, km, tempo) {
  const distanciaKm = Number(String(km).replace(",", "."));
  if (!(distanciaKm > 0 && distanciaKm <= 250)) throw new Error("Informe a distância que você correu (km).");
  if (!prova?.id || !prova?.data) throw new Error("Prova inválida.");
  return { provaId: prova.id, provaNome: String(prova.nome || "").slice(0, 200), data: prova.data,
    distanciaKm: Math.round(distanciaKm * 100) / 100, tempoSeg: lerTempo(tempo) };
}
const tempoTexto = (s) => (s == null ? null : `${s >= 3600 ? `${Math.floor(s / 3600)}:` : ""}${String(Math.floor((s % 3600) / 60)).padStart(s >= 3600 ? 2 : 1, "0")}:${String(s % 60).padStart(2, "0")}`);

function validarTreino(t) {
  const kmN = Number(String(t.km).replace(",", "."));
  if (!(kmN > 0 && kmN <= 300)) throw new Error("Informe a distância em km (até 300).");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(t.data || "")) throw new Error("Informe a data do treino.");
  if (t.data > hojeISO() && !estado.demo) throw new Error("A data do treino não pode ser no futuro.");
  const minutos = t.minutos === "" || t.minutos == null ? null : Number(t.minutos);
  if (minutos != null && !(Number.isInteger(minutos) && minutos > 0 && minutos <= 2000)) throw new Error("Tempo inválido (minutos inteiros).");
  const descricao = String(t.descricao || "").trim().slice(0, 120);
  return { km: Math.round(kmN * 100) / 100, data: t.data, minutos, descricao, origem: t.origem === "gpx" ? "gpx" : "manual" };
}

function codigoNovo() {
  const letras = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sem 0/O e 1/I para não confundir
  const v = new Uint32Array(6);
  crypto.getRandomValues(v);
  return [...v].map((n) => letras[n % letras.length]).join("");
}

  async salvarPerfil(dados) { this.d.usuarios[this.uid] = validarPerfil(dados); this.salvar(); }
  async usuarios(uids) {
    const m = {};
    for (const u of uids) if (this.d.usuarios[u]) m[u] = { uid: u, ...this.d.usuarios[u] };
    return m;
  }
  async buscarUsuarios(texto) {
    const t = normalizar(texto).replace(/^@/, "");
    if (t.length < 2) return [];
    return Object.entries(this.d.usuarios).filter(([u, p]) => u !== this.uid && (p.nomeBusca.includes(t) || p.handle.includes(t.replace(/ /g, ""))))
      .slice(0, 20).map(([uid, p]) => ({ uid, ...p }));
  }

  async provas() {
    const hoje = this.hoje();
    return Object.entries(this.d.provas).map(([id, p]) => ({ ...p, id })).filter((p) => p.data >= hoje).sort((a, b) => a.data.localeCompare(b.data));
  }
  async confirmacoes() {
    const hoje = this.hoje();
    return Object.values(this.d.confirmacoes).filter((c) => c.data >= hoje);
  }
  async confirmar(prova, sim, nome) {
    const id = `${prova.id}_${this.uid}`;
    if (sim) this.d.confirmacoes[id] = { provaId: prova.id, uid: this.uid, nome, data: prova.data, em: new Date().toISOString() };
    else delete this.d.confirmacoes[id];
    this.salvar();
  }

  }
  // Feed: provas confirmadas e provas concluídas. Treinos NÃO entram (são privados, só no Meu Painel).
  async feed(uids) {
    const set = new Set(uids);
    const conf = Object.values(this.d.confirmacoes).filter((c) => set.has(c.uid)).map((c) => ({ tipo: "confirmacao", ...c }));
    const fim = Object.values(this.d.conclusoes || {}).filter((c) => set.has(c.uid)).map((c) => ({ tipo: "conclusao", ...c }));
    return [...conf, ...fim].sort((a, b) => b.em.localeCompare(a.em)).slice(0, 40);
  }
  async usuariosDaCidade(cidade) {
    return Object.entries(this.d.usuarios).filter(([u, p]) => u !== this.uid && mesmaCidade(cidadeDa(p), cidade))
      .slice(0, 20).map(([uid, p]) => ({ uid, ...p }));
  }

  // --- provas passadas e conclusões ---
  async provaPorId(id) { return this.d.provas[id] ? { ...this.d.provas[id], id } : null; }
  async minhasConfirmacoes() { return Object.values(this.d.confirmacoes).filter((c) => c.uid === this.uid); }
  async minhasConclusoes() { return Object.values(this.d.conclusoes || {}).filter((c) => c.uid === this.uid); }
  async conclusoesDe(uids, desde) {
    const set = new Set(uids);
    return Object.values(this.d.conclusoes || {}).filter((c) => set.has(c.uid) && c.data >= desde);
  }
  async concluir(prova, km, tempo, nome) {
    const v = validarConclusao(prova, km, tempo);
    this.d.conclusoes = this.d.conclusoes || {};
    this.d.conclusoes[`${prova.id}_${this.uid}`] = { ...v, uid: this.uid, nome, em: new Date().toISOString() };
    this.salvar();
  }
  async removerConclusao(provaId) {
    delete (this.d.conclusoes || {})[`${provaId}_${this.uid}`];
    this.salvar();
  }

  // --- treinos ---
  async treinos(uid) {
    return Object.entries(this.d.treinos).filter(([, t]) => t.uid === uid).map(([id, t]) => ({ id, ...t })).sort((a, b) => b.data.localeCompare(a.data));
  }
  async adicionarTreino(t, nome) {
    const v = validarTreino(t);
    this.d.treinos[`t-${Date.now()}`] = { ...v, uid: this.uid, nome, em: new Date().toISOString() };
    this.salvar();
  }
  async removerTreino(id) {
    if (this.d.treinos[id]?.uid === this.uid) delete this.d.treinos[id];
    this.salvar();
  }
  // --- grupos ---
  async meusGrupos() {
    return Object.entries(this.d.grupos).filter(([, g]) => g.membros.includes(this.uid)).map(([id, g]) => ({ id, ...g }));
  }
  async criarGrupo(nome) {
    const n = String(nome || "").trim();
    if (n.length < 3 || n.length > 40) throw new Error("O nome do grupo deve ter de 3 a 40 caracteres.");
    const id = `g-${Date.now()}`;
    this.d.grupos[id] = { nome: n, codigo: codigoNovo(), dono: this.uid, membros: [this.uid], criadoEm: new Date().toISOString() };
    this.salvar();
    return { id, ...this.d.grupos[id] };
  }
  async entrarGrupo(codigo) {
    const c = String(codigo || "").trim().toUpperCase();
    const achado = Object.entries(this.d.grupos).find(([, g]) => g.codigo === c);
    if (!achado) throw new Error("Nenhum grupo com esse código.");
    const [, g] = achado;
    if (g.membros.includes(this.uid)) throw new Error("Você já está nesse grupo.");
    if (g.membros.length >= LIMITE_IN) throw new Error(`O grupo já tem ${LIMITE_IN} pessoas (limite do piloto).`);
    g.membros.push(this.uid);
    this.salvar();
    return g;
  }
  async sairGrupo(id) {
    const g = this.d.grupos[id];
    if (!g) return;
    if (g.dono === this.uid) delete this.d.grupos[id];
    else g.membros = g.membros.filter((u) => u !== this.uid);
    this.salvar();
  }

  // --- parceiros ---
  async parceiros() { return Object.entries(this.d.parceiros).map(([id, p]) => ({ id, ...p })); }

  // --- administração ---
  async ehAdmin() { return Boolean(this.d.admin); }
  async importarProvas(lista) {
    for (const p of lista) this.d.provas[p.id] = { ...p, destaque: this.d.provas[p.id]?.destaque || false };
    this.salvar();
  }
  async todasProvas() { return Object.entries(this.d.provas).map(([id, p]) => ({ ...p, id })).sort((a, b) => a.data.localeCompare(b.data)); }
  async destacar(id, sim) { if (this.d.provas[id]) this.d.provas[id].destaque = sim; this.salvar(); }
  async removerProva(id) { delete this.d.provas[id]; this.salvar(); }
  async salvarParceiro(p) { this.d.parceiros[`p-${Date.now()}`] = validarParceiro(p); this.salvar(); }
  async removerParceiro(id) { delete this.d.parceiros[id]; this.salvar(); }
}

function validarParceiro(p) {
  const nome = String(p.nome || "").trim();
  if (nome.length < 2 || nome.length > 80) throw new Error("Nome do parceiro: de 2 a 80 caracteres.");
  if (!CATEGORIAS[p.categoria]) throw new Error("Escolha a categoria.");
  // regiao: uma zona (São Paulo), "" = a cidade toda, "online" = aparece para todas as cidades
  if (p.regiao && p.regiao !== "online" && !REGIOES.includes(p.regiao)) throw new Error("Região inválida.");
  if (REGIOES.includes(p.regiao) && !temZonas(p.cidade || CIDADE)) throw new Error(`Zonas só existem em ${CIDADE}. Escolha "Cidade toda" ou "Online".`);
  const site = String(p.site || "").trim();
  if (site && !/^https?:\/\/\S+$/i.test(site)) throw new Error("O site deve começar com http:// ou https://.");
  return {
    nome, categoria: p.categoria, regiao: p.regiao || "", cidade: cidadeCanonica(p.cidade).slice(0, 60) || CIDADE,
    descricao: String(p.descricao || "").trim().slice(0, 240), site, instagram: String(p.instagram || "").trim().replace(/^@/, "").slice(0, 30),
    whatsapp: String(p.whatsapp || "").replace(/\D/g, "").slice(0, 13),
  };
}

// Valida o calendario.json gerado pelo coletor antes de publicar (o admin pode subir um arquivo errado).
function validarCalendario(json, soConferidas) {
  if (!json || !Array.isArray(json.provas)) throw new Error("Arquivo sem a lista 'provas'. Use o calendario.json do coletor.");
  const ok = [];
  for (const p of json.provas) {
    if (!p || typeof p.nome !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(p.data || "")) continue;
    if (soConferidas && !p.conferido) continue;
    const link = typeof p.link_inscricao === "string" && /^https?:\/\/\S+$/i.test(p.link_inscricao) ? p.link_inscricao : null;
    const fonteUrl = typeof p.fonte?.url === "string" && /^https?:\/\/\S+$/i.test(p.fonte.url) ? p.fonte.url : null;
    const texto = (v, n) => (typeof v === "string" && v.trim() ? v.trim().slice(0, n) : null);
    ok.push({
      id: (typeof p.id === "string" && /^[a-z0-9-]{3,90}$/.test(p.id) ? p.id : `${p.data}-${slug(p.nome)}`),
      nome: p.nome.slice(0, 200), data: p.data, horario: texto(p.horario, 5), local: texto(p.local, 200),
      cidade: cidadeCanonica(texto(p.cidade, 60) || texto(json.cidade, 60) || CIDADE),
      regiao: texto(p.regiao, 40), regioes: (p.regioes || []).filter((r) => REGIOES.includes(r)),
      distancias: (p.distancias || []).filter((d) => typeof d === "string").slice(0, 8).map((d) => d.slice(0, 30)),
      organizador: texto(p.organizador, 120), plataforma: texto(p.plataforma, 80), preco: texto(p.preco, 120), porte: texto(p.porte, 120),
      link_inscricao: link, fonte: { nome: texto(p.fonte?.nome, 80) || "", url: fonteUrl, coletado_em: texto(p.fonte?.coletado_em, 10) || "" },
      tags: (p.tags || []).filter((t) => t === "tematica" || t === "noturna"), conferido: Boolean(p.conferido),
    });
  }
  return ok;
}

class StoreFirebase {
  constructor(config) {
    this.demo = false;
    this.config = config;
    this.user = null;
  }
  hoje() { return hojeISO(); }
  async carregarSdk() {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSAO}/`;
    const [app, auth, fs] = await Promise.all([import(`${base}firebase-app.js`), import(`${base}firebase-auth.js`), import(`${base}firebase-firestore.js`)]);
    this.A = auth;
    this.F = fs;
    const instancia = app.initializeApp(this.config);
    this.auth = auth.getAuth(instancia);
    this.db = fs.getFirestore(instancia);
  }
  async iniciar(aoMudar) {
    await this.carregarSdk();
    try { await this.A.getRedirectResult(this.auth); } catch { /* sem redirecionamento pendente */ }
    this.A.onAuthStateChanged(this.auth, (u) => {
      this.user = u;
      aoMudar(u ? { uid: u.uid, email: u.email, nome: u.displayName || "", foto: u.photoURL || null } : null);
    });
  }
  async entrar() {
    const provedor = new this.A.GoogleAuthProvider();
    try {
      await this.A.signInWithPopup(this.auth, provedor);
    } catch (erro) {
      // Celular com pop-up bloqueado: tenta pelo redirecionamento.
      if (erro.code === "auth/popup-blocked" || erro.code === "auth/operation-not-supported-in-this-environment") {
        await this.A.signInWithRedirect(this.auth, provedor);
      } else if (erro.code !== "auth/popup-closed-by-user" && erro.code !== "auth/cancelled-popup-request") {
        throw new Error(erro.code === "auth/unauthorized-domain"
          ? "Este endereço não está autorizado no Firebase (Authentication > Configurações > Domínios autorizados)."
          : "Não foi possível entrar com o Google. Tente de novo.");
      }
    }
  }
  async sair() { await this.A.signOut(this.auth); }
  get uid() { return this.user?.uid; }

  // atalhos
  col(n) { return this.F.collection(this.db, n); }
  ref(n, id) { return this.F.doc(this.db, n, id); }
  async lista(q) { return (await this.F.getDocs(q)).docs.map((d) => ({ id: d.id, ...d.data() })); }
  async emPartes(colecao, campo, valores, extras = []) {
    const { query, where } = this.F;
    const saida = [];
    for (let i = 0; i < valores.length; i += LIMITE_IN) {
      saida.push(...(await this.lista(query(this.col(colecao), where(campo, "in", valores.slice(i, i + LIMITE_IN)), ...extras))));
    }
    return saida;
  }

  async perfil(uid) {
    const s = await this.F.getDoc(this.ref("usuarios", uid));
    return s.exists() ? { uid, ...s.data() } : null;
  }
  async salvarPerfil(dados) {
    await this.F.setDoc(this.ref("usuarios", this.uid), { ...validarPerfil(dados), atualizadoEm: new Date().toISOString() });
  }
  async usuarios(uids) {
    const m = {};
    await Promise.all([...new Set(uids)].map(async (u) => { const p = await this.perfil(u).catch(() => null); if (p) m[u] = p; }));
    return m;
  }
  async buscarUsuarios(texto) {
    const { query, where, limit } = this.F;
    const t = normalizar(texto).replace(/^@/, "");
    if (t.length < 2) return [];
    const [porNome, porHandle] = await Promise.all([
      this.lista(query(this.col("usuarios"), where("nomeBusca", ">=", t), where("nomeBusca", "<=", t + ""), limit(20))),
      this.lista(query(this.col("usuarios"), where("handle", "==", t.replace(/ /g, "")), limit(5))),
    ]);
    const m = new Map([...porHandle, ...porNome].map((p) => [p.id, { uid: p.id, ...p }]));
    m.delete(this.uid);
    return [...m.values()];
  }

  async provas() {
    const { query, where, orderBy } = this.F;
    return this.lista(query(this.col("provas"), where("data", ">=", this.hoje()), orderBy("data")));
  }
  async confirmacoes() {
    const { query, where } = this.F;
    return this.lista(query(this.col("confirmacoes"), where("data", ">=", this.hoje())));
  }
  async confirmar(prova, sim, nome) {
    const r = this.ref("confirmacoes", `${prova.id}_${this.uid}`);
    if (sim) await this.F.setDoc(r, { provaId: prova.id, uid: this.uid, nome, data: prova.data, em: new Date().toISOString() });
    else await this.F.deleteDoc(r);
  }

  async seguindo() {
    const { query, where } = this.F;
    return (await this.lista(query(this.col("follows"), where("seguidor", "==", this.uid)))).map((f) => f.alvo);
  }
  async seguidores(uid) {
    const { query, where, getCountFromServer } = this.F;
    return (await getCountFromServer(query(this.col("follows"), where("alvo", "==", uid)))).data().count;
  }
  async seguir(alvo, sim) {
    const r = this.ref("follows", `${this.uid}_${alvo}`);
    if (sim) await this.F.setDoc(r, { seguidor: this.uid, alvo, em: new Date().toISOString() });
    else await this.F.deleteDoc(r);
  }
  // Feed: provas confirmadas e provas concluídas. Treinos NÃO entram (são privados, só no Meu Painel).
  async feed(uids) {
    if (!uids.length) return [];
    const { orderBy, limit } = this.F;
    const [conf, fim] = await Promise.all([
      this.emPartes("confirmacoes", "uid", uids, [orderBy("em", "desc"), limit(40)]),
      this.emPartes("conclusoes", "uid", uids, [orderBy("em", "desc"), limit(40)]),
    ]);
    return [...conf.map((c) => ({ tipo: "confirmacao", ...c })), ...fim.map((c) => ({ tipo: "conclusao", ...c }))]
      .sort((a, b) => b.em.localeCompare(a.em)).slice(0, 40);
  }
  async usuariosDaCidade(cidade) {
    const { query, where, limit } = this.F;
    return (await this.lista(query(this.col("usuarios"), where("cidade", "==", cidade), limit(21))))
      .filter((p) => p.id !== this.uid).slice(0, 20).map((p) => ({ uid: p.id, ...p }));
  }

  // --- provas passadas e conclusões ---
  async provaPorId(id) {
    const s = await this.F.getDoc(this.ref("provas", id));
    return s.exists() ? { ...s.data(), id } : null;
  }
  async minhasConfirmacoes() {
    const { query, where } = this.F;
    return this.lista(query(this.col("confirmacoes"), where("uid", "==", this.uid)));
  }
  async minhasConclusoes() {
    const { query, where } = this.F;
    return this.lista(query(this.col("conclusoes"), where("uid", "==", this.uid)));
  }
  async conclusoesDe(uids, desde) {
    if (!uids.length) return [];
    return this.emPartes("conclusoes", "uid", uids, [this.F.where("data", ">=", desde)]);
  }
  async concluir(prova, km, tempo, nome) {
    const v = validarConclusao(prova, km, tempo);
    await this.F.setDoc(this.ref("conclusoes", `${prova.id}_${this.uid}`), { ...v, uid: this.uid, nome, em: new Date().toISOString() });
  }
  async removerConclusao(provaId) { await this.F.deleteDoc(this.ref("conclusoes", `${provaId}_${this.uid}`)); }

  async treinos(uid) {
    const { query, where, orderBy, limit } = this.F;
    return this.lista(query(this.col("treinos"), where("uid", "==", uid), orderBy("data", "desc"), limit(400)));
  }
  async adicionarTreino(t, nome) {
    await this.F.addDoc(this.col("treinos"), { ...validarTreino(t), uid: this.uid, nome, em: new Date().toISOString() });
  }
  async removerTreino(id) { await this.F.deleteDoc(this.ref("treinos", id)); }

  async meusGrupos() {
    const { query, where } = this.F;
    return this.lista(query(this.col("grupos"), where("membros", "array-contains", this.uid)));
  }
  async criarGrupo(nome) {
    const n = String(nome || "").trim();
    if (n.length < 3 || n.length > 40) throw new Error("O nome do grupo deve ter de 3 a 40 caracteres.");
    const g = { nome: n, codigo: codigoNovo(), dono: this.uid, membros: [this.uid], criadoEm: new Date().toISOString() };
    const r = await this.F.addDoc(this.col("grupos"), g);
    return { id: r.id, ...g };
  }
  async entrarGrupo(codigo) {
    const { query, where, limit, updateDoc, arrayUnion } = this.F;
    const c = String(codigo || "").trim().toUpperCase();
    if (!/^[A-Z0-9]{6}$/.test(c)) throw new Error("O código tem 6 letras ou números.");
    const [g] = await this.lista(query(this.col("grupos"), where("codigo", "==", c), limit(1)));
    if (!g) throw new Error("Nenhum grupo com esse código.");
    if (g.membros.includes(this.uid)) throw new Error("Você já está nesse grupo.");
    if (g.membros.length >= LIMITE_IN) throw new Error(`O grupo já tem ${LIMITE_IN} pessoas (limite do piloto).`);
    await updateDoc(this.ref("grupos", g.id), { membros: arrayUnion(this.uid) });
    return g;
  }
  async sairGrupo(id) {
    const g = await this.F.getDoc(this.ref("grupos", id));
    if (!g.exists()) return;
    if (g.data().dono === this.uid) await this.F.deleteDoc(this.ref("grupos", id));
    else await this.F.updateDoc(this.ref("grupos", id), { membros: this.F.arrayRemove(this.uid) });
  }

  async parceiros() { return this.lista(this.col("parceiros")); }

  async ehAdmin() {
    try {
      const s = await this.F.getDoc(this.ref("config", "admins"));
      const emails = s.exists() ? s.data().emails || [] : [];
      return Boolean(this.user?.email && emails.includes(this.user.email));
    } catch { return false; }
  }
  async importarProvas(lista) {
    // Em lotes de 400 (limite de 500 operações por lote). merge: não apaga o "destaque" já marcado.
    for (let i = 0; i < lista.length; i += 400) {
      const lote = this.F.writeBatch(this.db);
      for (const p of lista.slice(i, i + 400)) {
        const { id, ...dados } = p;
        lote.set(this.ref("provas", id), { ...dados, atualizadoEm: new Date().toISOString() }, { merge: true });
      }
      await lote.commit();
    }
  }
  async todasProvas() { return this.lista(this.F.query(this.col("provas"), this.F.orderBy("data"))); }
  async destacar(id, sim) { await this.F.updateDoc(this.ref("provas", id), { destaque: sim }); }
  async removerProva(id) { await this.F.deleteDoc(this.ref("provas", id)); }
  async salvarParceiro(p) { await this.F.addDoc(this.col("parceiros"), validarParceiro(p)); }
  async removerParceiro(id) { await this.F.deleteDoc(this.ref("parceiros", id)); }

  // Chaves do Strava da pessoa (strava/{uid}): só ela lê e escreve (firestore.rules). Nada de atividades aqui.
  async stravaLer() {
    const s = await this.F.getDoc(this.ref("strava", this.uid));
    return s.exists() ? s.data() : null;
  }
  async stravaSalvar(dados) { await this.F.setDoc(this.ref("strava", this.uid), dados); }
  async stravaApagar() { await this.F.deleteDoc(this.ref("strava", this.uid)); }

  // LGPD: apaga tudo o que é da pessoa e, por último, o login. Grupos que ela criou são apagados;
  // nos outros, ela só sai. As regras do Firestore permitem cada uma dessas exclusões.
  async excluirConta() {
    const { query, where, writeBatch } = this.F;
    const uid = this.uid;
    await Strava.desconectar().catch(() => {}); // revoga o acesso no Strava e apaga as chaves guardadas
    for (const g of await this.meusGrupos()) await this.sairGrupo(g.id);
    const consultas = [["confirmacoes", "uid"], ["conclusoes", "uid"], ["treinos", "uid"], ["follows", "seguidor"], ["follows", "alvo"]];
    const docs = (await Promise.all(consultas.map(([c, campo]) => this.F.getDocs(query(this.col(c), where(campo, "==", uid))))))
      .flatMap((s) => s.docs);
    for (let i = 0; i < docs.length; i += 400) {
      const lote = writeBatch(this.db);
      for (const d of docs.slice(i, i + 400)) lote.delete(d.ref);
      await lote.commit();
    }
    await this.F.deleteDoc(this.ref("usuarios", uid));
    try {
      await this.A.deleteUser(this.user);
    } catch (erro) {
      if (erro.code !== "auth/requires-recent-login") throw erro;
      // O Google pede um login recente para apagar a conta: confirma com o pop-up e tenta de novo.
      await this.A.reauthenticateWithPopup(this.user, new this.A.GoogleAuthProvider());
      await this.A.deleteUser(this.user);
    }
  }
}

const estado = {
  store: null, demo: false, usuario: null, perfil: null, admin: false,
  aba: "provas", provas: [], confirmacoes: [], seguindo: [], pessoas: {},
  filtros: { cidade: CIDADE, regioes: null, distancias: new Set(), tematica: false, noturna: false, amigos: false, preco: null, quando: null },
};

function preferencias() {
  try { return JSON.parse(localStorage.getItem("corridax-filtros") || "null"); } catch { return null; }
}
function salvarPreferencias() {
  try {
    const f = estado.filtros;
    localStorage.setItem("corridax-filtros", JSON.stringify({ cidade: f.cidade, regioes: f.regioes ? [...f.regioes] : null, distancias: [...f.distancias], tematica: f.tematica, noturna: f.noturna, preco: f.preco, quando: f.quando }));
  } catch { /* ignora */ }
}

// Filtro de cidade e zona a partir do perfil (no primeiro acesso, ao trocar de cidade no perfil
// e ao escolher outra cidade na lista). Em São Paulo começa pela zona da pessoa.
function filtrarPelaCidade(cidade) {
  const f = estado.filtros;
  f.cidade = cidade;
  const minhaZona = temZonas(cidade) && mesmaCidade(cidadeDa(estado.perfil), cidade) ? estado.perfil?.regiao : "";
  f.regioes = new Set(minhaZona ? [minhaZona] : []);
}

function tela(...filhos) {
  $("#conteudo").replaceChildren(...filhos.flat(Infinity).filter((f) => f != null && f !== false));
  window.scrollTo(0, 0);
}

async function executar(botao, acao) {
  const texto = botao?.textContent;
  if (botao) { botao.disabled = true; botao.textContent = "Aguarde..."; }
  try {
    return await acao();
  } catch (erro) {
    console.error(erro);
    toast(erro.message || "Algo deu errado. Tente de novo.");
    return undefined;
  } finally {
    if (botao) { botao.disabled = false; botao.textContent = texto; }
  }
}

// Valor em reais do texto do lote ("1º lote · R$ 149,90" -> 149.9); null quando não informado.
function precoValor(p) {
  const m = String(p.preco || "").match(/R\$\s*(\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?|\d+(?:,\d{1,2})?)/i);
  return m ? Number(m[1].replace(/\./g, "").replace(",", ".")) : null;
}

// Período escolhido nos filtros: fim de semana, próximos 30 dias ou este mês.
function noPeriodo(data, quando, hoje) {
  if (!quando) return true;
  const dias = diasAte(data, hoje);
  if (quando === "30d") return dias <= 30;
  if (quando === "mes") return data.slice(0, 7) === hoje.slice(0, 7);
  if (quando === "fds") {
    const d = new Date(`${hoje}T12:00:00`).getDay(); // 0 = domingo, 6 = sábado
    const ateSabado = d === 0 ? -1 : (6 - d);
    return dias >= Math.max(0, ateSabado) && dias <= ateSabado + 1;
  }
  return true;
}

const PRECOS = [[100, "Até R$ 100"], [150, "Até R$ 150"], [200, "Até R$ 200"]];
const PERIODOS = [["fds", "Fim de semana"], ["30d", "Próximos 30 dias"], ["mes", "Este mês"]];

function passaFiltros(p) {
  const f = estado.filtros;
  if (!mesmaCidade(cidadeDa(p), f.cidade)) return false;
  // Prova sem zona definida aparece em qualquer filtro de zona (com a etiqueta "zona a confirmar"):
  // senão ela some para quem filtra pela própria zona, que é quase todo mundo.
  if (temZonas(f.cidade) && f.regioes && f.regioes.size && p.regioes?.length) {
    if (!p.regioes.some((r) => f.regioes.has(r))) return false;
  }
  if (f.distancias.size) {
    const kms = distanciasEmKm(p.distancias);
    const faixas = DISTANCIAS.filter((d) => f.distancias.has(d.chave));
    if (!kms.some((k) => faixas.some((d) => k >= d.min && k <= d.max))) return false;
  }
  if (f.preco) {
    const v = precoValor(p);
    if (v == null || v > f.preco) return false;
  }
  if (!noPeriodo(p.data, f.quando, estado.store.hoje())) return false;
  const tags = etiquetas(p);
  if (f.tematica && !tags.includes("tematica")) return false;
  if (f.noturna && !tags.includes("noturna")) return false;
  if (f.amigos) {
    const amigos = new Set(estado.seguindo);
    if (!estado.confirmacoes.some((c) => c.provaId === p.id && amigos.has(c.uid))) return false;
  }
  return true;
}

    estado.confirmacoes = await estado.store.confirmacoes();
    toast(vou ? "Presença retirada." : "Presença confirmada! Seus amigos vão ver.");
    aoMudar();

}

function quemVai(p) {
  const daProva = estado.confirmacoes.filter((c) => c.provaId === p.id);

  const amigos = new Set(estado.seguindo);

  const outros = daProva.length - amigosVao.length - (vou ? 1 : 0);
  return el("div", { class: "quem" },
    amigosVao.length ? el("span", { class: "pilha" }, amigosVao.slice(0, 3).map((c) => avatar({ nome: c.nome }, true))) : null,

      : daProva.length ? `${daProva.length} ${daProva.length === 1 ? "confirmado" : "confirmados"}` : "Seja o primeiro a confirmar"));
}

// Data e hora da largada (sem horário, considera 7h). Na demonstração, "agora" é 15/10/2026 ao meio-dia.
function quandoLargada(p) { return Date.parse(`${p.data}T${p.horario || "07:00"}:00`); }
const agoraApp = () => (estado.demo ? Date.parse(`${estado.store.hoje()}T12:00:00`) : Date.now());

// Card do topo: a sua próxima prova confirmada ou, se não houver, a próxima prova com os filtros atuais.
function cartaoDestaque(visiveis) {
  const minhas = new Set(estado.confirmacoes.filter((c) => c.uid === estado.store.uid).map((c) => c.provaId));
  const minha = estado.provas.find((p) => minhas.has(p.id) && quandoLargada(p) >= agoraApp());

function renderListaProvas() {

  const porDia = new Map();
  for (const p of resto.filter((x) => !x.destaque)) { // as em destaque já aparecem acima

// ---------- Strava (só o próprio atleta vê) ----------
// Login: o Strava devolve ?strava=1&code=...&state=...&scope=... para esta página; o servidor (STRAVA_API)
// troca o código pelas chaves, que ficam em strava/{uid}. Os dados são buscados na hora e não são guardados.
const Strava = {
  ligado: () => Boolean(STRAVA_API) && !estado.demo,

  conectar() {
    const estadoLogin = codigoAleatorio();
    try { sessionStorage.setItem("ritmex-strava-state", estadoLogin); } catch { /* sem armazenamento: o retorno vai falhar com aviso */ }
    const volta = `${location.origin}${location.pathname}?strava=1`;
    location.href = "https://www.strava.com/oauth/authorize?" + new URLSearchParams({
      client_id: STRAVA_CLIENT_ID, redirect_uri: volta, response_type: "code", approval_prompt: "auto",
      scope: STRAVA_ESCOPOS, state: estadoLogin,
    });
  },

  // Chamado depois do login no Ritmex. Devolve true se havia um retorno do Strava para tratar.
  async concluirRetorno() {
    const p = new URLSearchParams(location.search);
    if (!p.has("strava")) return false;
    history.replaceState(null, "", location.pathname); // tira o código da barra de endereço
    let esperado = null;
    try { esperado = sessionStorage.getItem("ritmex-strava-state"); sessionStorage.removeItem("ritmex-strava-state"); } catch { /* ignora */ }
    if (p.get("error")) { toast("Conexão com o Strava cancelada."); return true; }
    if (!p.get("code") || !esperado || p.get("state") !== esperado) { toast("Não foi possível confirmar a conexão com o Strava. Tente de novo."); return true; }
    const escopos = (p.get("scope") || "").split(",");
    if (!escopos.some((e) => e.startsWith("activity:read"))) {
      toast("Para ver suas corridas, autorize o acesso às atividades no Strava.");
      return true;
    }
    const chaves = await Strava.servidor("token", { code: p.get("code") });
    await estado.store.stravaSalvar(Strava.paraGuardar(chaves, escopos.join(",")));
    toast("Strava conectado! Só você vê esses dados.");
    return true;
  },

  paraGuardar(chaves, escopo, anterior = {}) {
    const a = chaves.athlete || {};
    return {
      atletaId: a.id ?? anterior.atletaId ?? null,
      nome: [a.firstname, a.lastname].filter(Boolean).join(" ") || anterior.nome || "",
      foto: (a.profile_medium && /^https:\/\//.test(a.profile_medium)) ? a.profile_medium : (anterior.foto || null),
      escopo: escopo ?? anterior.escopo ?? "",
      accessToken: chaves.access_token,
      refreshToken: chaves.refresh_token,
      expiraEm: Number(chaves.expires_at) || 0,
      conectadoEm: anterior.conectadoEm || new Date().toISOString(),
    };
  },

  async servidor(acao, corpo) {
    let resposta;
    try {
      resposta = await fetch(`${STRAVA_API}/api/${acao}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
    } catch {
      throw new Error("Não foi possível falar com o servidor do Ritmex. Tente de novo.");
    }
    const dados = await resposta.json().catch(() => ({}));
    if (!resposta.ok) throw new Error(dados.erro || "Falha na conexão com o Strava.");
    return dados;
  },

  // Chave de acesso válida (a do Strava vence a cada 6 horas; renova pelo servidor).
  async chave() {
    const dados = await estado.store.stravaLer();
    if (!dados) return null;
    if (dados.expiraEm - 120 > Date.now() / 1000) return dados;
    const novas = await Strava.servidor("refresh", { refresh_token: dados.refreshToken });
    const atual = Strava.paraGuardar(novas, undefined, dados);
    await estado.store.stravaSalvar(atual);
    return atual;
  },

  async api(caminho, chave) {
    const r = await fetch(`https://www.strava.com/api/v3${caminho}`, { headers: { Authorization: `Bearer ${chave.accessToken}` } });
    if (r.status === 401) throw Object.assign(new Error("O Strava não aceitou mais o acesso. Conecte de novo."), { reconectar: true });
    if (r.status === 429) throw new Error("Muitos pedidos ao Strava agora. Tente de novo em alguns minutos.");
    if (!r.ok) throw new Error(`O Strava respondeu com erro ${r.status}.`);
    return r.json();
  },

  // Tudo o que o painel mostra, buscado agora (nada é guardado).
  async resumo() {
    const chave = await Strava.chave();
    if (!chave) return null;
    const oitoSemanas = Math.floor(Date.now() / 1000) - 56 * 86400;
    const [atleta, atividades] = await Promise.all([
      Strava.api("/athlete", chave),
      Strava.api(`/athlete/activities?after=${oitoSemanas}&per_page=100`, chave),
    ]);
    const stats = atleta?.id ? await Strava.api(`/athletes/${atleta.id}/stats`, chave) : null;
    const corridas = (Array.isArray(atividades) ? atividades : [])
      .filter((a) => ["Run", "TrailRun", "VirtualRun"].includes(a.sport_type || a.type))
      .sort((a, b) => String(b.start_date_local).localeCompare(String(a.start_date_local)));
    return { chave, atleta, stats, corridas };
  },

  async desconectar() {
    const chave = await Strava.chave().catch(() => null);
    if (chave && STRAVA_API) await Strava.servidor("desconectar", { access_token: chave.accessToken }).catch(() => {});
    await estado.store.stravaApagar();
  },
};

function codigoAleatorio() {
  const v = new Uint32Array(4);
  crypto.getRandomValues(v);
  return [...v].map((n) => n.toString(36)).join("");
}

// Ritmo em min/km a partir de segundos e metros: "5:12 /km".
function ritmoDe(segundos, metros) {
  if (!(segundos > 0 && metros > 0)) return null;
  const s = Math.round(segundos / (metros / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} /km`;
}
const duracao = (s) => (s >= 3600 ? `${Math.floor(s / 3600)}h${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}` : `${Math.round(s / 60)} min`);

function seloStrava() {
  return el("p", { class: "dica powered-strava" }, "Dados do ", el("b", {}, "Strava"), " · visíveis só para você");
}

// Painel do Strava (aba Meu Painel). Monta um esqueleto na hora e preenche quando o Strava responder.
function painelStrava() {
  if (!STRAVA_API && !estado.demo) return null;
  const caixa = el("section", { class: "painel" }, el("h2", {}, "Seu Strava"), el("p", { class: "carregando" }, "Carregando..."));
  const corpo = (...filhos) => caixa.replaceChildren(el("h2", {}, "Seu Strava"), ...filhos.flat(Infinity).filter(Boolean));
  const botaoConectar = () => el("button", { type: "button", class: "btn-strava", onclick: () => Strava.conectar() }, "Conectar com Strava");

  if (estado.demo) {
    corpo(el("p", { class: "dica" }, "Na versão real, você conecta o seu Strava e vê aqui suas estatísticas, km por semana, últimas corridas com ritmo e frequência cardíaca, e a quilometragem dos seus tênis. Só você vê esses dados."));
    return caixa;
  }

  (async () => {
    let r;
    try {
      r = await Strava.resumo();
    } catch (erro) {
      corpo(el("p", { class: "erro" }, erro.message), erro.reconectar ? botaoConectar() : null);
      return;
    }
    if (!r) {
      corpo(el("p", { class: "dica" }, "Conecte o seu Strava para ver aqui suas estatísticas e corridas. Só você vê esses dados: nada vai para o feed nem para o ranking, e nada é guardado no Ritmex."), botaoConectar());
      return;
    }
    const { atleta, stats, corridas } = r;
    const total = (t) => (t && typeof t === "object" ? t : { distance: 0, count: 0, moving_time: 0 });
    const recente = total(stats?.recent_run_totals), ano = total(stats?.ytd_run_totals), sempre = total(stats?.all_run_totals);

    // km por semana (últimas 8 semanas, da mais antiga para a atual)
    const agora = Date.now();
    const semanas = Array.from({ length: 8 }, (_, i) => ({ fim: agora - i * 7 * 86400000, km: 0 })).reverse();
    for (const c of corridas) {
      const quando = Date.parse(c.start_date);
      const s = semanas.find((x) => quando <= x.fim && quando > x.fim - 7 * 86400000);
      if (s) s.km += c.distance / 1000;
    }
    const maior = Math.max(1, ...semanas.map((s) => s.km));
    const quatro = corridas.filter((c) => Date.parse(c.start_date) > agora - 28 * 86400000);
    const ritmo4 = ritmoDe(quatro.reduce((s, c) => s + c.moving_time, 0), quatro.reduce((s, c) => s + c.distance, 0));

    const sair = el("button", { type: "button", class: "btn btn--sm btn--perigo" }, "Desconectar");
    sair.addEventListener("click", () => {
      if (!confirmarAcao(sair, "Toque de novo para desconectar")) return;
      executar(sair, async () => { await Strava.desconectar(); toast("Strava desconectado."); irPara("painel"); });

    corpo(

// ---------- Gráfico de barras simples (km por semana, ritmo por semana) ----------
// valores: [{ rotulo, valor, texto }]; a última barra (a semana atual) fica em laranja.
function graficoBarras(valores, descricao) {
  const maior = Math.max(1e-9, ...valores.map((v) => v.valor || 0));
  return el("div", { class: "barras", role: "img", "aria-label": descricao },
    valores.map((v) => el("div", { class: "barra" },
      el("span", { class: "barra-valor" }, v.texto ?? ""),
      el("div", { class: "barra-col", style: `height:${v.valor ? Math.max(3, Math.round((v.valor / maior) * 100)) : 0}%` }),
      el("span", { class: "barra-rotulo" }, v.rotulo))));
}

// Agrupa itens com { quando (ms), metros, segundos } nas últimas 8 semanas (da mais antiga para a atual).
function porSemana(itens, agora) {
  const semanas = Array.from({ length: 8 }, (_, i) => ({ fim: agora - (7 - i) * 7 * 86400000, metros: 0, segundos: 0, metrosComTempo: 0 }));
  for (const it of itens) {
    const s = semanas.find((x) => it.quando <= x.fim && it.quando > x.fim - 7 * 86400000);
    if (!s) continue;
    s.metros += it.metros;
    if (it.segundos) { s.segundos += it.segundos; s.metrosComTempo += it.metros; }
  }
  return semanas.map((s, i) => ({
    ...s, rotulo: i === 7 ? "atual" : `-${7 - i}`,
    ritmo: s.metrosComTempo ? s.segundos / (s.metrosComTempo / 1000) : null, // segundos por km
  }));
}
const ritmoCurto = (sPorKm) => (sPorKm ? `${Math.floor(sPorKm / 60)}:${String(Math.round(sPorKm % 60)).padStart(2, "0")}` : "");
// Ritmo: barra mais alta = mais rápido (o inverso do tempo por km).
const barrasRitmo = (semanas) => semanas.map((s) => ({ rotulo: s.rotulo, valor: s.ritmo ? 3600 / s.ritmo : 0, texto: ritmoCurto(s.ritmo) }));
const barrasKm = (semanas) => semanas.map((s) => ({ rotulo: s.rotulo, valor: s.metros / 1000, texto: String(Math.round(s.metros / 1000)) }));

// ---------- Meu Painel (privado: só o próprio atleta vê) ----------
async function telaPainel() {
  const uid = estado.store.uid;
  const hoje = estado.store.hoje();
  if (!estado.provas.length) await carregarProvas();
  const [lista, confirmadas, conclusoes] = await Promise.all([
    estado.store.treinos(uid), estado.store.minhasConfirmacoes(), estado.store.minhasConclusoes(),
  ]);
  const mes = hoje.slice(0, 7), ano = hoje.slice(0, 4);
  const soma = (f) => lista.filter(f).reduce((s, t) => s + t.km, 0);
  const doAno = conclusoes.filter((c) => c.data.startsWith(ano));
  const ritmos = conclusoes.filter((c) => c.tempoSeg && c.distanciaKm).map((c) => c.tempoSeg / c.distanciaKm);
  const melhorRitmo = ritmos.length ? Math.min(...ritmos) : null;

  // Termômetro: o maior treino das últimas 4 semanas contra a distância da próxima prova confirmada.
  const proxima = estado.provas.filter((p) => confirmadas.some((c) => c.provaId === p.id) && p.data >= hoje)
    .sort((a, b) => a.data.localeCompare(b.data))[0];
  const limite4 = new Date(Date.parse(`${hoje}T12:00:00`) - 28 * 86400000).toISOString().slice(0, 10);
  const maiorTreino = Math.max(0, ...lista.filter((t) => t.data >= limite4).map((t) => t.km));
  const alvo = proxima ? Math.max(0, ...distanciasEmKm(proxima.distancias)) : 0;
  let termometro = null;
  if (proxima) {
    const dias = diasAte(proxima.data, hoje);
    const pronto = alvo && maiorTreino >= alvo * 0.75;
    termometro = el("section", { class: "painel" },
      el("h2", {}, "Termômetro da próxima prova"),
      el("p", { class: "dica", style: "margin-top:0" }, `${proxima.nome} · ${dataLonga(proxima.data)} · faltam ${dias} ${dias === 1 ? "dia" : "dias"}`),
      el("p", { class: pronto ? "ok" : "aviso" }, !alvo
        ? "A distância dessa prova ainda não foi informada."
        : maiorTreino
          ? (pronto
            ? `Seu maior treino nas últimas 4 semanas foi de ${km(maiorTreino)}. Para ${km(alvo)}, você está no caminho certo.`
            : `Seu maior treino nas últimas 4 semanas foi de ${km(maiorTreino)}. Para ${km(alvo)}, vale aumentar aos poucos o treino mais longo.`)
          : `Lance seus treinos (ou conecte o Strava) para acompanhar o preparo para ${km(alvo)}.`));
  }

  // Ritmo por semana com os treinos lançados no Ritmex (os que têm tempo).
  const semanas = porSemana(lista.map((t) => ({ quando: Date.parse(`${t.data}T12:00:00`), metros: t.km * 1000, segundos: t.minutos ? t.minutos * 60 : 0 })),
    agoraApp());
  const temRitmo = semanas.some((s) => s.ritmo);

  tela(
    el("p", { class: "dica", style: "margin:0 0 10px" }, "🔒 Só você vê esta tela. Treinos e dados do Strava não aparecem no feed nem no ranking."),
    el("div", { class: "numeros" },
      el("div", { class: "numero" }, el("b", {}, km(soma((t) => t.data.startsWith(ano)))), el("span", {}, `treinos em ${ano}`)),
      el("div", { class: "numero" }, el("b", {}, km(soma((t) => t.data.startsWith(mes)))), el("span", {}, "treinos neste mês")),
      el("div", { class: "numero" }, el("b", {}, String(doAno.length)), el("span", {}, `provas concluídas em ${ano}`)),
      el("div", { class: "numero" }, el("b", {}, melhorRitmo ? `${ritmoCurto(melhorRitmo)} /km` : "—"), el("span", {}, "melhor ritmo em prova"))),
    termometro,
    painelStrava(),
    el("section", { class: "painel" },
      el("h2", {}, "Evolução do ritmo"),
      temRitmo
        ? [graficoBarras(barrasRitmo(semanas), `Ritmo médio por semana: ${semanas.map((s) => ritmoCurto(s.ritmo) || "sem treino").join(", ")}`),
          el("p", { class: "dica" }, "Ritmo médio por semana (min/km) dos treinos lançados aqui. Barra mais alta = mais rápido.")]
        : el("p", { class: "dica" }, "Lance treinos com o tempo (ou conecte o Strava) para ver a evolução do seu ritmo.")),
    await secaoMinhasProvas(confirmadas, conclusoes),
    secaoLancarTreino(),
    el("section", { class: "painel" }, el("h2", {}, "Histórico de treinos"), historicoTreinos(lista)));
}

      el("div", { class: "info", style: "flex-basis:100%" }, el("b", {}, p.nome), el("span", {}, `${dataBR(p.data)} · ${p.local || ""}`)),
      el("div", { class: "linha", style: "flex:1" }, kmProva, tempo, ok));
  });
  const itensFeitas = [...conclusoes].sort((a, b) => b.data.localeCompare(a.data)).map((c) => {
    const tirar = el("button", { type: "button", class: "btn btn--sm btn--sec", "aria-label": `Desfazer conclusão de ${c.provaNome}` }, "Desfazer");
    tirar.addEventListener("click", () => {

      executar(tirar, async () => { await estado.store.removerConclusao(c.provaId); irPara("painel"); });

    return el("div", { class: "pessoa" },

  return el("section", { class: "painel" },

function secaoLancarTreino() {
  const hoje = estado.store.hoje();
  const erro = el("p", { class: "erro", role: "alert", hidden: true });
  const campos = {
    data: el("input", { id: "tr-data", type: "date", value: hoje, max: hoje }),
    km: el("input", { id: "tr-km", type: "text", inputmode: "decimal", placeholder: "ex.: 8,5" }),
    minutos: el("input", { id: "tr-min", type: "number", inputmode: "numeric", min: "1", placeholder: "opcional" }),
    descricao: el("input", { id: "tr-desc", type: "text", maxlength: "120", placeholder: "ex.: Longão no Ibirapuera" }),
  };
  let origem = "manual";
  const gpx = el("input", { type: "file", accept: ".gpx,application/gpx+xml,application/xml", "aria-label": "Importar arquivo GPX" });
  gpx.addEventListener("change", async () => {
    const arquivo = gpx.files[0];
    if (!arquivo) return;
    try {
      if (arquivo.size > 15 * 1024 * 1024) throw new Error("Arquivo muito grande (máx. 15 MB).");
      const r = lerGpx(await arquivo.text());
      campos.km.value = String(r.km).replace(".", ",");
      if (r.minutos) campos.minutos.value = String(r.minutos);
      if (r.data) campos.data.value = r.data;
      if (r.nome && !campos.descricao.value) campos.descricao.value = r.nome.slice(0, 120);
      origem = "gpx";
      toast(`GPX lido: ${km(r.km)}. Confira e salve.`);
    } catch (e) {
      erro.textContent = e.message;
      erro.hidden = false;
    }
  });
  const salvar = el("button", { type: "submit", class: "btn btn--cheio" }, "Salvar treino");
  const form = el("form", { novalidate: true },
    el("div", { class: "grade" },
      el("div", { class: "campo" }, el("label", { for: "tr-data" }, "Data"), campos.data),
      el("div", { class: "campo" }, el("label", { for: "tr-km" }, "Distância (km)"), campos.km),
      el("div", { class: "campo" }, el("label", { for: "tr-min" }, "Tempo (min)"), campos.minutos)),
    el("div", { class: "campo" }, el("label", { for: "tr-desc" }, "Descrição"), campos.descricao),
    el("details", { class: "mais" }, el("summary", {}, "Importar de um arquivo GPX (relógio, Strava)"),
      el("p", { class: "dica" }, "No Strava: abra a atividade › ⋯ › Exportar GPX. No relógio, use o app do fabricante. O arquivo é lido aqui no aparelho; só a distância, o tempo e a data são salvos."),
      gpx),
    erro, salvar);
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    erro.hidden = true;
    executar(salvar, async () => {
      try {
        await estado.store.adicionarTreino({ data: campos.data.value, km: campos.km.value, minutos: campos.minutos.value, descricao: campos.descricao.value, origem }, estado.perfil.nome);
      } catch (er) {
        erro.textContent = er.message;
        erro.hidden = false;
        return;
      }
      toast("Treino salvo! Só você vê.");
      irPara("painel");
    });
  });
  return el("section", { class: "painel" }, el("h2", {}, "Lançar treino"), form);
}

function historicoTreinos(lista) {
  if (!lista.length) return el("p", { class: "vazio" }, "Nenhum treino ainda. Lance o primeiro acima.");

    remover.addEventListener("click", () => executar(remover, async () => { await estado.store.removerTreino(t.id); irPara("painel"); }));
    return el("div", { class: "pessoa" },
      el("div", { class: "info" }, el("b", {}, km(t.km)), el("span", {}, [dataBR(t.data), t.minutos ? `${t.minutos} min` : null, t.minutos ? ritmoDe(t.minutos * 60, t.km * 1000) : null, t.descricao, t.origem === "gpx" ? "GPX" : null].filter(Boolean).join(" · "))),
      remover);
  });
}

// Pede um segundo toque para ações destrutivas (sem confirm(), que bloqueia a página).
function confirmarAcao(botao, texto) {
  if (botao.dataset.confirmando === "1") return true;
  botao.dataset.confirmando = "1";
  const original = botao.textContent;
  botao.textContent = texto;
  setTimeout(() => { botao.dataset.confirmando = ""; botao.textContent = original; }, 3500);
  return false;
}
