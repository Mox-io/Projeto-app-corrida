  const caixa = el("div", {});
  const render = () => {
    const lista = todos.filter((p) => (categoria === "todas" || p.categoria === categoria) && perto(p));
    caixa.replaceChildren(
      chipsAlternar([["todas", "Todos"], ...Object.entries(CATEGORIAS)], (v) => v === categoria, (v) => { categoria = v; render(); }, true),
      lista.length ? el("ul", { class: "lista", style: "margin-top:10px" }, lista.map((p) => el("li", { class: "cartao" },
        el("div", { class: "cartao-nome" }, p.nome),
        el("div", { class: "meta" }, `${CATEGORIAS[p.categoria]} · ${ondeAtende(p)}`),
        p.descricao ? el("p", { class: "meta", style: "color:var(--text)" }, p.descricao) : null,
        el("div", { class: "links" }, linkInsta(p.instagram), linkWhats(p.whatsapp, "WhatsApp"), linkSeguro(p.site, "Site")))))
        : el("p", { class: "vazio" }, "Nenhum parceiro na sua região ainda."));
  };
  render();
  return el("section", { class: "painel" },
    el("h2", {}, "Assessorias e parceiros"),
    el("p", { class: "dica", style: "margin-top:0" }, `Nutrição, fisioterapia, assessorias e treinadores de ${minhaZona ? `${minhaCidade}, ${NOME_REGIAO[minhaZona].toLowerCase()}` : minhaCidade} e online.`),
    caixa,
    /^(mailto:|https:\/\/)/.test(CONTATO_PARCEIROS)
      ? el("p", { class: "dica" }, "É profissional da corrida? ", el("a", { href: CONTATO_PARCEIROS, target: "_blank", rel: "noopener noreferrer" }, "Quero ser parceiro"))
      : null);
}

// ---------- Administração ----------
async function telaAdmin() {
  if (!estado.admin) return irPara("provas");
  marcarAba(null);
  const [provas, confirmacoes, parceiros] = await Promise.all([estado.store.todasProvas(), estado.store.confirmacoes(), estado.store.parceiros()]);
  const contagem = {};
  for (const c of confirmacoes) contagem[c.provaId] = (contagem[c.provaId] || 0) + 1;

  // Importar calendário do coletor
  const arquivo = el("input", { type: "file", accept: ".json,application/json", "aria-label": "Arquivo calendario.json" });
  const soConferidas = el("input", { type: "checkbox", checked: true });
  const previa = el("p", { class: "dica" });
  const publicar = el("button", { type: "button", class: "btn", disabled: true }, "Publicar no app");
  let carregadas = [];
  arquivo.addEventListener("change", async () => {
    try {
      const json = JSON.parse(await arquivo.files[0].text());
      carregadas = validarCalendario(json, soConferidas.checked);
      previa.textContent = `${carregadas.length} prova(s) prontas para publicar${json.gerado_em ? ` (coleta de ${dataBR(json.gerado_em)})` : ""}.`;
      publicar.disabled = !carregadas.length;
    } catch (e) {
      previa.textContent = e.message || "Não foi possível ler o arquivo.";
      publicar.disabled = true;
    }
  });
  soConferidas.addEventListener("change", () => arquivo.dispatchEvent(new Event("change")));
  publicar.addEventListener("click", () => executar(publicar, async () => {
    await estado.store.importarProvas(carregadas);
    toast(`${carregadas.length} prova(s) publicadas.`);
    telaAdmin();
  }));

  // Lista de provas: destaque (plano gold), confirmações e remoção
  const linhas = provas.map((p) => {
    const destaque = el("button", { type: "button", class: `btn btn--sm ${p.destaque ? "" : "btn--sec"}` }, p.destaque ? "★ Destaque" : "☆ Destacar");
    destaque.addEventListener("click", () => executar(destaque, async () => { await estado.store.destacar(p.id, !p.destaque); telaAdmin(); }));
    const remover = el("button", { type: "button", class: "btn btn--sm btn--perigo" }, "Remover");
    remover.addEventListener("click", () => {
      if (!confirmarAcao(remover, "Confirmar")) return;
      executar(remover, async () => { await estado.store.removerProva(p.id); telaAdmin(); });
    });
    const n = contagem[p.id] || 0;
    return el("div", { class: "pessoa", style: "flex-wrap:wrap" },
      el("div", { class: "info" }, el("b", {}, p.nome),
        el("span", {}, [dataBR(p.data), p.regiao, `${n} ${n === 1 ? "confirmado" : "confirmados"}`].filter(Boolean).join(" · "))),
      el("div", { class: "linha" }, destaque, remover));
  });
  const exportar = el("button", { type: "button", class: "btn btn--sec btn--sm" }, "Baixar confirmações por prova (CSV)");
  exportar.addEventListener("click", () => {
    const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const csv = ["data;prova;organizador;confirmados;destaque", ...provas.map((p) => [dataBR(p.data), p.nome, p.organizador, contagem[p.id] || 0, p.destaque ? "sim" : "não"].map(esc).join(";"))].join("\r\n");
    const url = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
    const a = el("a", { href: url, download: "confirmacoes-corrida-x.csv" });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  });

  // Parceiros
  const pf = {
    nome: el("input", { type: "text", maxlength: "80", id: "pa-nome" }),
    categoria: el("select", { id: "pa-cat" }, Object.entries(CATEGORIAS).map(([v, n]) => el("option", { value: v }, n))),
    regiao: el("select", { id: "pa-reg" }, el("option", { value: "" }, "Cidade toda"), el("option", { value: "online" }, "Online (todas as cidades)"),
      REGIOES.map((r) => el("option", { value: r }, `${NOME_REGIAO[r]} (${CIDADE})`))),
    cidade: el("input", { type: "text", maxlength: "60", id: "pa-cid", value: CIDADE }),
    instagram: el("input", { type: "text", maxlength: "31", id: "pa-ig", placeholder: "@perfil" }),
    whatsapp: el("input", { type: "text", maxlength: "20", id: "pa-wa", inputmode: "tel", placeholder: "(11) 90000-0000" }),
    site: el("input", { type: "url", maxlength: "200", id: "pa-site", placeholder: "https://" }),
    descricao: el("textarea", { maxlength: "240", id: "pa-desc" }),
  };
  const addParceiro = el("button", { type: "button", class: "btn" }, "Adicionar parceiro");
  addParceiro.addEventListener("click", () => executar(addParceiro, async () => {
    await estado.store.salvarParceiro(Object.fromEntries(Object.entries(pf).map(([k, v]) => [k, v.value])));
    toast("Parceiro adicionado.");
    telaAdmin();
  }));
  const campo = (id, rotulo, entrada) => el("div", { class: "campo" }, el("label", { for: id }, rotulo), entrada);

  tela(
    el("button", { type: "button", class: "voltar", onclick: () => irPara("provas") }, "← Voltar"),
    el("section", { class: "painel" },
      el("h2", {}, "Publicar provas do coletor"),
      el("p", { class: "dica" }, "Envie o calendario.json gerado pelo coletor (python -m corridax ou o app web dele). Provas com o mesmo id são atualizadas; o destaque é mantido."),
      arquivo, el("label", { class: "opcao" }, soConferidas, "Só as aprovadas (deixar \"a conferir\" de fora)"), previa, publicar),
    el("section", { class: "painel" },
      el("h2", {}, `Provas publicadas (${provas.length})`),
      el("p", { class: "dica" }, "\"Destaque\" é o plano gold: a prova aparece no topo do calendário. As confirmações são o número para mostrar aos organizadores."),
      exportar,
      el("div", { style: "margin-top:8px" }, linhas.length ? linhas : el("p", { class: "vazio" }, "Nenhuma prova publicada ainda."))),
    el("section", { class: "painel" },
      el("h2", {}, "Parceiros"),
      el("div", { class: "grade grade--2" }, campo("pa-nome", "Nome", pf.nome), campo("pa-cat", "Categoria", pf.categoria),
        campo("pa-reg", "Região", pf.regiao), campo("pa-cid", "Cidade", pf.cidade),
        campo("pa-ig", "Instagram", pf.instagram), campo("pa-wa", "WhatsApp", pf.whatsapp)),
      campo("pa-site", "Site", pf.site), campo("pa-desc", "Descrição curta", pf.descricao), addParceiro,
      el("h3", {}, `Cadastrados (${parceiros.length})`),
      parceiros.map((p) => {
        const rem = el("button", { type: "button", class: "btn btn--sm btn--perigo" }, "Remover");
        rem.addEventListener("click", () => {
          if (!confirmarAcao(rem, "Confirmar")) return;
          executar(rem, async () => { await estado.store.removerParceiro(p.id); telaAdmin(); });
        });
        return el("div", { class: "pessoa" }, el("div", { class: "info" }, el("b", {}, p.nome), el("span", {}, [CATEGORIAS[p.categoria], p.regiao === "online" ? "online" : NOME_REGIAO[p.regiao], cidadeDa(p)].filter(Boolean).join(" · "))), rem);
      })));
}

// ============================================================================
//  INÍCIO
// ============================================================================
async function aoMudarUsuario(u) {
  estado.usuario = u;
  if (!u) {
    estado.perfil = null;
    telaLogin();
    return;
  }
  tela(el("p", { class: "carregando" }, "Carregando seu perfil..."));
  try {
    [estado.perfil, estado.admin] = await Promise.all([estado.store.perfil(u.uid), estado.store.ehAdmin()]);
  } catch (erro) {
    console.error(erro);
    telaLogin("Não foi possível carregar seu perfil. Verifique a internet e tente de novo.");
    return;
  }
  if (!estado.perfil) return telaPerfil(true);
  const pref = preferencias();
  filtrarPelaCidade(pref?.cidade || cidadeDa(estado.perfil));
  if (pref?.regioes) estado.filtros.regioes = new Set(pref.regioes);
  estado.filtros.distancias = new Set(pref?.distancias || []);
  estado.filtros.tematica = Boolean(pref?.tematica);
  estado.filtros.noturna = Boolean(pref?.noturna);
  estado.filtros.preco = PRECOS.some(([v]) => v === pref?.preco) ? pref.preco : null;
  estado.filtros.quando = PERIODOS.some(([v]) => v === pref?.quando) ? pref.quando : null;
  atualizarTopo();
  // Voltando do login do Strava: conclui a conexão e abre o Meu Painel, onde ficam os dados do Strava.
  try {
    if (await Strava.concluirRetorno()) estado.aba = "painel";
  } catch (erro) {
    console.error(erro);
    toast(erro.message || "Não foi possível conectar o Strava.");
    estado.aba = "painel";
  }
  irPara(estado.aba || "provas");
}

async function iniciar() {
  estado.demo = !FIREBASE_CONFIG || new URLSearchParams(location.search).has("demo");
  estado.store = estado.demo ? new StoreDemo() : new StoreFirebase(FIREBASE_CONFIG);
  for (const b of document.querySelectorAll("#abas button")) b.addEventListener("click", () => irPara(b.dataset.aba));
  $("#btn-perfil").addEventListener("click", () => irPara("perfil"));
  try {
    await estado.store.iniciar(aoMudarUsuario);
  } catch (erro) {
    console.error(erro);
    $("#carregando").textContent = "Não foi possível carregar o app (sem internet?). Recarregue a página.";
  }
}

iniciar();
</script>
